name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_cli:
        description: Upload the tested CLI release archives
        type: boolean
        default: false
      cli_only:
        description: Run the Rust CLI matrix only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    if: ${{ !inputs.cli_only }}
    name: Swift app • ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Swift scanner
        run: |
          swift --version
          swift test
      - name: Build and verify the native application
        run: |
          app="$(scripts/package-macos.sh)"
          codesign --verify --strict "$app"
      - name: Check the Mac app release archive and Homebrew cask
        if: matrix.runner == 'macos-15'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          app="$(scripts/package-macos.sh --universal)"
          archive="$(scripts/archive-macos.sh "$app")"
          (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
          read -r digest _ < "$archive.sha256"
          brew tap-new --no-git local/diskuse16x-ci
          tap="$(brew --repository local/diskuse16x-ci)"
          mkdir -p "$tap/Casks"
          scripts/render-cask "$(cat scripts/release-version)" "$digest" > "$tap/Casks/diskuse16x.rb"
          brew style local/diskuse16x-ci/diskuse16x

  dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        working-directory: cli
        env:
          CARGO_DENY_VERSION: 0.20.2
        run: |
          cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
          cargo deny --locked check advisories bans licenses sources

  cli:
    name: Rust CLI • ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare musl build tools, ncdu and gdu for export checks, and rpmbuild
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils musl-tools ncdu gdu rpm
      - name: Check formatting, lint, and tests for both editions
        working-directory: cli
        run: |
          rustup show
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo clippy --locked --all-targets --features pro -- -D warnings
          cargo test --locked --features pro
      - name: Build and verify the Basic and Pro release archives
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          (cd cli && rustup target add "$CLI_TARGET")
          for edition in basic pro; do
            if [[ "$edition" == pro ]]; then
              archive="$(scripts/package-cli.sh --pro "$CLI_TARGET")"
            else
              archive="$(scripts/package-cli.sh "$CLI_TARGET")"
            fi
            (
              cd dist
              if [[ "$RUNNER_OS" == macOS ]]; then
                shasum -a 256 -c "$(basename "$archive").sha256"
              else
                sha256sum -c "$(basename "$archive").sha256"
              fi
            )
            echo "$(basename "$archive"): $(wc -c < "$archive") bytes"
            mkdir -p ".build/cli-qa-$edition"
            tar -xzf "$archive" -C ".build/cli-qa-$edition"
            python3 scripts/check-cli.py ".build/cli-qa-$edition/diskuse16x"
            python3 scripts/check-tui.py ".build/cli-qa-$edition/diskuse16x"
          done
      - name: Build and check the .deb and .rpm packages
        if: runner.os == 'Linux'
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          for archive in diskuse16x diskuse16x-pro; do
            scripts/package-linux.sh "dist/$archive-$CLI_TARGET.tar.gz"
          done
          python3 scripts/check-linux-packages.py deb dist
          python3 scripts/check-linux-packages.py rpm dist
      - name: Check the Homebrew formulas
        if: matrix.runner == 'macos-15' || matrix.runner == 'ubuntu-24.04'
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          scripts/check-formula.sh "$CLI_TARGET"
      - name: Test installer platform routing and failure paths
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 scripts/check-install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_cli
        with:
          name: diskuse16x-cli-${{ matrix.target }}
          path: |
            dist/diskuse16x-${{ matrix.target }}.tar.gz
            dist/diskuse16x-${{ matrix.target }}.tar.gz.sha256
            dist/diskuse16x-pro-${{ matrix.target }}.tar.gz
            dist/diskuse16x-pro-${{ matrix.target }}.tar.gz.sha256
            dist/diskuse16x*.deb
            dist/diskuse16x*.deb.sha256
            dist/diskuse16x*.rpm
            dist/diskuse16x*.rpm.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_cli && matrix.runner == 'ubuntu-24.04'
        with:
          name: diskuse16x-cli-installer
          path: scripts/install.sh
          if-no-files-found: error
