name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_cli:
        description: Upload the tested CLI release archives
        type: boolean
        default: false
      cli_only:
        description: Run the Rust CLI matrix only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    if: ${{ !inputs.cli_only }}
    name: Swift app • ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Swift scanner
        run: |
          swift --version
          swift test
      - name: Build and verify the native application
        run: |
          app="$(scripts/package-macos.sh)"
          codesign --verify --strict "$app"

  dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check advisories, licenses, bans, and sources
        working-directory: cli
        env:
          CARGO_DENY_VERSION: 0.20.2
        run: |
          cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
          cargo deny --locked check advisories bans licenses sources

  cli:
    name: Rust CLI • ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare musl build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils musl-tools
      - name: Check formatting, lint, and tests
        working-directory: cli
        run: |
          rustup show
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and verify CLI release archive
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          (cd cli && rustup target add "$CLI_TARGET")
          archive="$(scripts/package-cli.sh "$CLI_TARGET")"
          (
            cd dist
            if [[ "$RUNNER_OS" == macOS ]]; then
              shasum -a 256 -c "$(basename "$archive").sha256"
            else
              sha256sum -c "$(basename "$archive").sha256"
            fi
          )
          mkdir -p .build/cli-qa
          tar -xzf "$archive" -C .build/cli-qa
          python3 scripts/check-cli.py .build/cli-qa/space16x
          python3 scripts/check-tui.py .build/cli-qa/space16x
      - name: Test installer platform routing and failure paths
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 scripts/check-install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_cli
        with:
          name: space16x-cli-${{ matrix.target }}
          path: |
            dist/space16x-${{ matrix.target }}.tar.gz
            dist/space16x-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload_cli && matrix.runner == 'ubuntu-24.04'
        with:
          name: space16x-cli-installer
          path: scripts/install.sh
          if-no-files-found: error
