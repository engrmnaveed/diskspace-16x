name: Publish crate

# Publishes the diskuse16x crate for a release that is already tagged, for example
# when the release ran before CARGO_REGISTRY_TOKEN was set or crates.io refused it.
# Publish release does the same as its last step, through scripts/publish-crate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "Use a release tag such as v1.0.0." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Publish the crate to crates.io
        # The steps of scripts/publish-crate, written out here: tags made before the
        # script existed, such as v1.0.0, don't contain it.
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          : "${CARGO_REGISTRY_TOKEN:?Add CARGO_REGISTRY_TOKEN to the release environment first.}"
          [[ "$version" == "$(cat ../scripts/release-version)" ]] ||
            { echo "The tag's checkout is version $(cat ../scripts/release-version), not $version." >&2; exit 1; }
          if cargo info --registry crates-io "diskuse16x@$version" >/dev/null 2>&1; then
            echo "crates.io already has diskuse16x $version."
            exit 0
          fi
          cargo publish --locked
