[package]
name = "space16x"
version = "0.2.3"
edition = "2024"
rust-version = "1.100"
description = "A terminal disk space explorer for macOS and Linux"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
