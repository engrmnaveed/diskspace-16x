[package]
name = "space16x"
version = "0.5.0"
edition = "2024"
rust-version = "1.100"
description = "A terminal disk space explorer for macOS and Linux"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

# One codegen unit with full LTO keeps the Basic archive small and the scanner fast.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
