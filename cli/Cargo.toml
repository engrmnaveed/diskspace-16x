[package]
name = "diskuse16x"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "A read-only disk space explorer for the terminal, on macOS and Linux"
license = "MIT"
repository = "https://github.com/engrmnaveed/diskuse16x"
homepage = "https://github.com/engrmnaveed/diskuse16x/blob/main/docs/guide/README.md"
documentation = "https://github.com/engrmnaveed/diskuse16x/blob/main/docs/cli.md"
readme = "README.md"
keywords = ["disk-usage", "disk-space", "ncdu", "tui", "treemap"]
categories = ["command-line-utilities", "filesystem"]
# crates.io gets only what builds the executable.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
# The Pro edition. Pro-only dependencies are optional and enabled here, as in
# pro = ["dep:name"], so the Basic build never compiles them.
pro = []

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

# One codegen unit with full LTO keeps the Basic archive small and the scanner fast.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
